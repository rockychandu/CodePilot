name: CodePilot Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-and-tests:
    name: Backend Lint, Security & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Python Automated Test Suite
        run: |
          python tests/comprehensive_suite.py
          python tests/api/test_modular_api.py
          python tests/unit/test_repositories.py

  frontend-build-and-lint:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Verify Frontend Test Runner
        run: npm test

      - name: Build Production Assets
        run: npm run build
