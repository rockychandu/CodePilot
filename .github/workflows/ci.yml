name: CodePilot Production CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run 500+ Automated Tests
        run: |
          python -m unittest discover tests -p "*.py"

      - name: Run Multi-Language Smoke Test Diagnostics
        run: |
          python -c "from codepilot.engine.runtime_manager import RuntimeManager; print(RuntimeManager.run_runtime_smoke_tests())"
