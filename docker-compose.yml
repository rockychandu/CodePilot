version: '3.8'

services:
  api:
    build: .
    container_name: codepilot-backend-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=sqlite:///codepilot.db
      - CODEPILOT_SECRET_KEY=codepilot-super-secret-jwt-key-2026-production
    restart: unless-stopped

  web:
    image: python:3.12-alpine
    container_name: codepilot-frontend-web
    working_dir: /app
    volumes:
      - .:/app
    command: python -m http.server 8000
    ports:
      - "8000:8000"
    depends_on:
      - api
    restart: unless-stopped
