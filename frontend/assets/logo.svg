<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Indigo Purple Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Pilot Core Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Hexagonal Frame / Shield -->
  <path d="M 256,32 L 448,128 L 448,384 L 256,480 L 64,384 L 64,128 Z" 
        fill="url(#bgGrad)" 
        stroke="url(#cyanGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"/>

  <!-- Inner Geometric "C" Arc -->
  <path d="M 360,160 C 290,100 170,110 130,190 C 90,270 110,360 210,390 C 290,410 360,360 380,310" 
        fill="none" 
        stroke="url(#cyanGrad)" 
        stroke-width="28" 
        stroke-linecap="round"/>

  <!-- Code Symbol: Left Bracket < -->
  <path d="M 210,190 L 150,256 L 210,322" 
        fill="none" 
        stroke="#F8FAFC" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Code Symbol: Right Bracket > -->
  <path d="M 302,190 L 362,256 L 302,322" 
        fill="none" 
        stroke="url(#purpleGrad)" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Pilot Center Compass / Spark Core -->
  <polygon points="256,200 270,242 312,256 270,270 256,312 242,270 200,256 242,242" 
           fill="#38BDF8" 
           filter="url(#glow)"/>

  <circle cx="256" cy="256" r="8" fill="#F8FAFC"/>
</svg>
